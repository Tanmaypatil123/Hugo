name: hugo_app
description: "Hugo - unofficial open-source client for the Hugging Face Hub"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  http: ^1.6.0
  pdfrx: 2.6.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
